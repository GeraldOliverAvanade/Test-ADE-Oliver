name: simple-dev
version: 1.0.0
summary: Simple Dev Environment
description: Minimal Terraform ADE definition
runner: <acrName>.azurecr.io/ade/terraform-runner:1.0
templatePath: .

parameters:
  - id: envName
    name: Environment Name
    type: string
    required: true

  # REQUIRED because your Terraform expects it
  - id: resource_group_name
    name: Resource Group Name
    type: string
    required: true

  # Optional (you already default to RG location if empty)
  - id: location
    name: Location
    type: string
    required: false
