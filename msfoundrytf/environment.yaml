name: MSFoundryPrivate
version: 1.0.0
summary: MS Foundry with VNet + Private Endpoint + Private DNS
description: Deploys Azure AI Services (Foundry) with a VNet, Private Endpoint, and Private DNS Zone.
runner: "acrtfoliver.azurecr.io/ade-terraform-runner:1.0.0"
templatePath: "."

parameters:
  - id: resource_group_name
    name: Resource Group Name
    type: string
    required: true

  - id: location
    name: Location
    type: string
    required: true

  - id: ai_services_name
    name: AI Services Name
    type: string
    required: true

  - id: custom_subdomain_name
    name: Custom Subdomain Name
    type: string
    required: true

  - id: sku_name
    name: SKU Name
    type: string
    required: false

  - id: public_network_access
    name: Public Network Access (Enabled/Disabled)
    type: string
    required: false

  - id: local_authentication_enabled
    name: Local Authentication Enabled
    type: boolean
    required: false

  - id: outbound_network_access_restricted
    name: Outbound Network Access Restricted
    type: boolean
    required: false

  # Network (added)
  - id: vnet_name
    name: VNet Name
    type: string
    required: false

  - id: vnet_address_space
    name: VNet Address Space
    type: string
    required: false

  - id: pe_subnet_name
    name: Private Endpoint Subnet Name
    type: string
    required: false

  - id: pe_subnet_prefixes
    name: Private Endpoint Subnet Prefix
    type: string
    required: false
