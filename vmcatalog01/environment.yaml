name: ADEVmVnetNsgBastion
version: 1.1.0
summary: VM (Windows/Linux) + VNet/Subnets + NSG + Bastion (Terraform)
description: Deploys RG, VNet, VM subnet, AzureBastionSubnet, NSG, VM, optional VM Public IP, and Bastion.
runner: "acrtfoliver.azurecr.io/ade-terraform-runner:1.0.0"
templatePath: "."

parameters:
  - id: resource_group_name
    name: Resource Group Name
    type: string
    required: true

  - id: location
    name: Location
    type: string
    required: true

  - id: os_type
    name: OS Type (windows/linux)
    type: string
    required: true

  - id: vm_name
    name: VM Name
    type: string
    required: true

  - id: vm_size
    name: VM Size / SKU
    type: string
    required: true

  - id: os_disk_size_gb
    name: OS Disk Size (GB)
    type: integer
    required: false

  - id: admin_username
    name: Admin Username
    type: string
    required: true

  - id: admin_password
    name: Admin Password (Windows only)
    type: string
    required: false

  - id: ssh_public_key
    name: SSH Public Key (Linux only)
    type: string
    required: false

  - id: enable_vm_public_ip
    name: Enable VM Public IP
    type: boolean
    required: false

  - id: zone
    name: Zone (e.g. "1", or empty)
    type: string
    required: false

  - id: enable_auto_shutdown
    name: Enable Auto Shutdown (Windows only)
    type: boolean
    required: false

  - id: auto_shutdown_time_utc
    name: Auto Shutdown Time (UTC HHmm)
    type: string
    required: false

  - id: vnet_name
    name: VNet Name
    type: string
    required: false

  - id: vnet_address_space
    name: VNet Address Space (comma-separated)
    type: string
    required: false

  - id: vm_subnet_name
    name: VM Subnet Name
    type: string
    required: false

  - id: vm_subnet_prefixes
    name: VM Subnet Prefixes (comma-separated)
    type: string
    required: false

  - id: bastion_subnet_prefixes
    name: Bastion Subnet Prefixes (comma-separated)
    type: string
    required: false
